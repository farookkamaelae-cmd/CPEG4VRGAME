<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Computer Engineering Simulator</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="data/i18n.js"></script>
  <script src="shared/room-structure.js"></script>
  <script src="shared/camera-locations.js"></script>
  <script src="src/rooms/hub/models.js?v=16"></script>
  <script src="src/rooms/hub/interactions.js?v=16"></script>
  <script src="src/rooms/hub/room.js?v=16"></script>
  <script src="src/rooms/hardware/components.js"></script>
  <script src="src/rooms/hardware/assembly.js"></script>
  <script src="src/rooms/hardware/room.js"></script>
  <script src="src/rooms/programming/data.js"></script>
  <script src="src/rooms/programming/game.js"></script>
  <script src="src/rooms/programming/room.js"></script>
  <script src="src/rooms/network/data.js"></script>
  <script src="src/rooms/network/game.js"></script>
  <script src="src/rooms/network/room.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #07111f; color: #fff; font-family: system-ui, sans-serif; }
    #toolbar { position: fixed; inset: 0 0 auto; z-index: 5; display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; padding: .75rem 1rem; background: #07111fe8; }
    #toolbar strong { margin-right: auto; }
    button, select { border: 1px solid #38bdf8; border-radius: .5rem; padding: .55rem .8rem; color: inherit; background: #10243a; font: inherit; cursor: pointer; }
    a-scene { position: fixed; inset: 0; width: 100%; height: 100%; }
    #status { position: fixed; z-index: 5; inset: auto 1rem 1rem; min-height: 1rem; padding: .6rem .8rem; background: #07111fe8; border-radius: .5rem; pointer-events: none; }
  </style>
</head>
<body>
  <header id="toolbar">
    <strong data-i18n="app.title">ห้องจำลองวิศวกรรมคอมพิวเตอร์</strong>
    <button id="home" data-i18n="nav.home">กลับห้องหลัก</button>
    <nav id="room-nav"></nav>
  </header>
  <a-scene background="color: #07111f" renderer="antialias: true; colorManagement: true" cursor="rayOrigin: mouse; fuse: false" raycaster="objects: .selectable" webxr="requiredFeatures: local-floor">
    <a-entity id="world"></a-entity>
    <a-entity id="player-camera" camera look-controls="pointerLockEnabled: false" wasd-controls="enabled: false" position="0 1.6 5"></a-entity>
    <a-entity laser-controls="hand: left" raycaster="objects: .selectable; far: 8"></a-entity>
    <a-entity laser-controls="hand: right" raycaster="objects: .selectable; far: 8"></a-entity>
    <a-entity light="type: ambient; intensity: 1.1"></a-entity>
    <a-entity light="type: directional; intensity: 1.2" position="-2 6 4"></a-entity>
  </a-scene>
  <p id="status" role="status" aria-live="polite"></p>
  <script src="src/main.js"></script>
</body>
</html>
